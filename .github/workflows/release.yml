name: Release

# Bump the version in a pull request, merge it, then push a matching tag (git tag v1.1.0 && git push origin v1.1.0).
on:
    push:
        tags: ["v*"]

permissions:
    contents: read
    # npm trusted publishing: GitHub proves the package was built here, so no npm token is stored.
    id-token: write

# CI only stages the release. A maintainer approves it on npm with 2FA before it goes public,
# so a compromised workflow can't publish on its own.

jobs:
    publish:
        name: Publish to npm
        runs-on: ubuntu-latest
        timeout-minutes: 10
        env:
            HUSKY: 0
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
                  cache: npm

            - name: Install
              run: npm ci

            - name: Tag matches package version
              run: test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./package.json").version')"

            - name: Test
              run: npm test

            - name: Build
              run: npm run build

            # Provenance is added automatically with trusted publishing.
            - name: Stage on npm
              run: npm stage publish --access public
