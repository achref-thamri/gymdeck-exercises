name: Release

# Push a version tag (npm version minor && git push --follow-tags) to publish.
on:
    push:
        tags: ["v*"]

permissions:
    contents: read
    # npm trusted publishing: GitHub proves the package was built here, so no npm token is stored.
    id-token: write

jobs:
    publish:
        name: Publish to npm
        runs-on: ubuntu-latest
        timeout-minutes: 10
        env:
            HUSKY: 0
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
                  cache: npm

            - name: Install
              run: npm ci

            - name: Tag matches package version
              run: test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./package.json").version')"

            - name: Test
              run: npm test

            # prepublishOnly builds the package. Provenance is added automatically with trusted publishing.
            - name: Publish
              run: npm publish --access public
