name: CI

on:
    push:
        branches: [main]
    pull_request:

# A newer push to the same branch makes the older run obsolete.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    checks:
        name: Validate, lint, typecheck, test and build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        env:
            # Git hooks are for local commits only.
            HUSKY: 0
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install
              run: npm ci

            - name: Validate exercises
              run: npm run generate

            - name: Generated files are committed
              run: git diff --exit-code -- schema.json exercise-ids.json

            - name: Formatting
              run: npm run format:check

            - name: Lint
              run: npm run lint -- --max-warnings=0

            - name: Typecheck
              run: npx tsc --noEmit

            - name: Test
              run: npx vitest run

            - name: Build
              run: npx tsdown
